# 운영 흐름:
#   1) 빌드 머신: docker compose build  → docker save crane-shell:latest -o crane-shell.tar
#   2) tar 를 운영 서버로 옮긴 뒤      : docker load -i crane-shell.tar
#   3) 운영 서버: 같은 디렉토리에 .env 와 이 docker-compose.yml 만 있으면 됨
#   4) IP 변경 시: .env 만 수정 후 `docker compose up -d` (재빌드 불필요)
# 환경별 이미지(로컬 · 빌드 머신): env 파일과 IMAGE_TAG 만 다르다. 인자 없이 build 하면 예전 그대로 crane-shell:latest.
#   IMAGE_TAG=dev docker compose --env-file deploy/env/dev.env build        (stage.env · prod.env 도 같음)
#   IMAGE_TAG=dev docker compose --env-file .env --env-file deploy/env/dev.env up -d --no-build
#   프로젝트 이름은 아래 name: 이 DEPLOY_ENV 로 정한다(crane-shell-dev · -stage · -prod). -p 는 필요 없다.
# 자동화: develop · main push → .github/workflows/deploy-199.yml 이 위 1~3 을 대신하고
#   199 에서 deploy/deploy.sh <env> <tag> 를 불러 load · up · 응답 확인(deploy/smoke.sh) · 실패 시 직전 태그 복귀.
#   환경별 값은 deploy/env/<env>.env, 이미지 태그는 <env>-<sha7>, 프로젝트 이름은 name: 이 DEPLOY_ENV 로 정한다(crane-shell-<env>).
# [환경별(dev · stage · prod) 배포 — 지금은 주석. 켜려면 아래 '# >' 줄의 '# >' 를 지운다]
# 프로젝트 이름 = 환경(crane-shell-dev · -stage · -prod). 켜기 전에는 디렉토리 이름이 프로젝트가 되어 main 과 같다.
# 기존 운영 컨테이너 crane-shell 은 옛 프로젝트 소속이라, 켜기 전에 옛 것을 내리거나 전환 때까지 이대로 둔다.
# > name: crane-shell-${DEPLOY_ENV:-prod}

services:
  shell:
    # 운영 서버에서는 build 하지 않고 load 한 이미지를 그대로 사용한다.
    # 빌드 머신에서만 `docker compose build` 가 동작하면 충분하므로 build 블록은 유지.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # VITE_* 는 Vite 가 빌드 시점에 번들에 인라인하므로 ARG 로 주입해야 한다.
        # 빌드 머신의 .env 또는 셸 환경에 VITE_GOOGLE_MAPS_* 가 정의돼 있어야
        # compose 가 읽어서 Dockerfile ARG 로 전달한다. 운영 서버에는 둘 필요 없음.
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
        # crane · indoor 주소 분리. 비우면 나누지 않는다(main 과 같음). 예) INDOOR_PATH=/crane_rnd/indoor/ docker compose build
        INDOOR_PATH: ${INDOOR_PATH:-}
        # [환경별(dev · stage · prod) 배포 — 지금은 주석] 켜려면 '# >' 를 지운다. 주석인 동안은 /crane_rnd/ · prod 고정.
        # > BASE_PATH: ${BASE_PATH:-/crane_rnd/}
        # > DEPLOY_ENV: ${DEPLOY_ENV:-prod}
    # [환경별(dev · stage · prod) 배포 — 지금은 주석] 환경별 태그 · 컨테이너 이름. 주석인 동안은 main 과 같은 latest / crane-shell.
    # > image: crane-shell:${IMAGE_TAG:-latest}
    # > container_name: crane-shell${CONTAINER_SUFFIX:-}
    image: crane-shell:latest
    container_name: crane-shell
    ports:
      - "${SHELL_PORT:-33600}:80"
    environment:
      # nginx envsubst 가 /etc/nginx/templates/default.conf.template 의
      # ${BACKEND_HOST} 등을 이 값으로 치환한다.
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
      LIDAR_HOST: ${LIDAR_HOST}
      LIDAR_PORT: ${LIDAR_PORT}
      # 미설정 시 nginx envsubst 가 빈 값을 넣어 부팅이 실패하므로 기본값을 둔다.
      # (기본값이면 캐빈 모니터링 연결만 502, 나머지 서비스는 정상)
      CABIN_HOST: ${CABIN_HOST:-127.0.0.1}
      CABIN_PORT: ${CABIN_PORT:-8765}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
