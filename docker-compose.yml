# 운영 흐름:
#   1) 빌드 머신: docker compose build  → docker save crane-shell:latest -o crane-shell.tar
#   2) tar 를 운영 서버로 옮긴 뒤      : docker load -i crane-shell.tar
#   3) 운영 서버: 같은 디렉토리에 .env 와 이 docker-compose.yml 만 있으면 됨
#   4) IP 변경 시: .env 만 수정 후 `docker compose up -d` (재빌드 불필요)
services:
  shell:
    # 운영 서버에서는 build 하지 않고 load 한 이미지를 그대로 사용한다.
    # 빌드 머신에서만 `docker compose build` 가 동작하면 충분하므로 build 블록은 유지.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # VITE_* 는 Vite 가 빌드 시점에 번들에 인라인하므로 ARG 로 주입해야 한다.
        # 빌드 머신의 .env 또는 셸 환경에 VITE_GOOGLE_MAPS_* 가 정의돼 있어야
        # compose 가 읽어서 Dockerfile ARG 로 전달한다. 운영 서버에는 둘 필요 없음.
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
    image: crane-shell:latest
    container_name: crane-shell
    ports:
      - "${SHELL_PORT:-33600}:80"
    environment:
      # nginx envsubst 가 /etc/nginx/templates/default.conf.template 의
      # ${BACKEND_HOST} 등을 이 값으로 치환한다.
      BACKEND_HOST: ${BACKEND_HOST}
      BACKEND_PORT: ${BACKEND_PORT}
      LIDAR_HOST: ${LIDAR_HOST}
      LIDAR_PORT: ${LIDAR_PORT}
      # 미설정 시 nginx envsubst 가 빈 값을 넣어 부팅이 실패하므로 기본값을 둔다.
      # (기본값이면 캐빈 모니터링 연결만 502, 나머지 서비스는 정상)
      CABIN_HOST: ${CABIN_HOST:-127.0.0.1}
      CABIN_PORT: ${CABIN_PORT:-8765}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
