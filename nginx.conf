server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Health check endpoint
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # API proxy → backend server
    # 앞단 reverse proxy 가 rewrite 한 경우 /api/ 로 도달
    location /api/ {
        proxy_pass http://192.168.135.199:33500/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 앞단이 rewrite 없이 그대로 /crane_rnd/api/* 로 전달한 경우에도 안전하게 처리
    location /crane_rnd/api/ {
        rewrite ^/crane_rnd/api/(.*)$ /api/$1 break;
        proxy_pass http://192.168.135.199:33500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket proxy → backend server
    location /ws/ {
        proxy_pass http://192.168.135.199:33500/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # 앞단이 rewrite 없이 그대로 /crane_rnd/ws/* 로 전달한 경우에도 안전하게 처리
    location /crane_rnd/ws/ {
        rewrite ^/crane_rnd/ws/(.*)$ /ws/$1 break;
        proxy_pass http://192.168.135.199:33500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Root hit → redirect into the SPA base path
    location = / {
        return 302 /crane_rnd/;
    }

    # index.html — never cache
    location = /crane_rnd/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # Immutable hashed assets — cache forever (only inside /crane_rnd/)
    location ~* ^/crane_rnd/.+\.(?:js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif|glb|gltf|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA entry: /crane_rnd and any deeper client-side route → serve index.html
    location /crane_rnd/ {
        try_files $uri $uri/ /crane_rnd/index.html;
    }

    # "/crane_rnd" (no trailing slash) → canonical form
    location = /crane_rnd {
        return 302 /crane_rnd/;
    }
}
